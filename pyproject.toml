[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchpro"
version = "0.1.0"
description = "A benchmark execution and management tool"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
benchpro = "benchpro.cli:cli" 