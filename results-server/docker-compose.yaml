version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: benchpro-results-db
    environment:
      POSTGRES_USER: benchpro
      POSTGRES_PASSWORD: benchpro_dev
      POSTGRES_DB: benchpro_results
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchpro -d benchpro_results"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: benchpro-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@benchpro.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:

