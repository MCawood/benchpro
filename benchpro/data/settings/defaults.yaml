metadata:
  file_version: "1.0"  # Version of this settings file format
  last_updated: "2024-01-07T12:00:00"   # Will be set by version management script

settings:
  immutable:
    # Core settings that cannot be changed
    version:
      value: "1.0.0"  # Will be updated by version management script
      type: str
      description: "BenchPro version"
      
  site_mutable:
    # Settings that only site admin can configure
    testing:
      value: false
      type: bool
      description: "Testing mode controlled by site administrator"
      
    use_slurm_simulator:
      value: false
      type: bool
      description: "Use local Slurm simulator instead of system Slurm installation"
      
    slurm_simulator:
      value:
        connection_type: "lima"
        instance: "slurm"
        env_vars: {}
      type: dict
      description: "Configuration for connecting to Slurm simulator via Lima"
      
    template_paths:
      value:
        - "${XDG_DATA_HOME:-~/.local/share}/benchpro/templates"
        - "/usr/local/share/benchpro/templates"
        - "/usr/share/benchpro/templates"
      type: list
      description: "Paths to search for templates"
      
  user_mutable:
    # Settings that both site admin and users can configure
    debug:
      value: false
      type: bool
      description: "Enable debug mode"

    max_running_tasks:
      value: 2
      type: int
      description: "Maximum number of tasks that can run simultaneously"

    task_locations:
      value:
        build: "${HOME}/dev/benchpro"
        benchmark: "${HOME}/dev/benchpro"
        custom: null
      type: dict
      description: "Default locations for different task types"
    
    task_history_size:
      value: 100
      type: int
      description: "Number of tasks to keep in history"
      
    logging:
      value:
        level: "INFO"
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      type: dict
      description: "Logging configuration"

    executor:
      value:
        type: "local"
        slurm_simulator:
          enabled: true
          connection_type: "lima"
          instance: "slurm"
      type: dict
      description: "Task executor configuration" 