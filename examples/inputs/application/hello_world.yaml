# Hello World Application with Modules
task_type: "application"
name: "hello_world"
version: "1.0"
description: "Hello World application with Intel and Intel MPI dependencies"

# Build configuration
build:
  source: "hello_world.c"
  compiler: "gcc"
  flags: "-O2"
  output: "hello_world"
  threads: 4

# Environment configuration with module dependencies
environment:
  module_paths:
    - "/Users/mcawood/dev/benchpro_2.0/examples/modulefiles"  # Path to custom modules
  modules:
    - name: intel
      version: "24.0"
    - name: impi
      version: "21.11"
  variables:
    SYSTEM_TYPE: default

# Job configuration
job:
  name: "hello_world_build"
  nodes: 1
  tasks_per_node: 1
  time_limit: "00:10:00"

# Workspace configuration
workspace:
  source_dir: "source"
  build_dir: "build"
  logs_dir: "logs"
  keep_source: true
  keep_build: true

# Template specification
template: "hello_world.j2"

# Execution configuration
execution:
  type: "local" 
