# Profile for running the Hello World benchmark
task_type: "benchmark"

# Job configuration
job:
  name: "hello_world_bench"
  description: "Hello World benchmark run"
  output_dir: "examples/output"

# Scheduler configuration
scheduler:
  type: "slurm"
  queue: "compute"
  nodes: 1
  tasks_per_node: 1
  time_limit: "00:10:00"

# Template configuration
template:
  base_template: "benchmark_run.j2"

# Environment configuration
environment:
  modules: []

# Benchmark configuration
benchmark:
  name: "hello_world"
  application: "hello_world"
  input_params: "" 