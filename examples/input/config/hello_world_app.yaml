# Profile for building the Hello World application
task_type: "application"

# Job configuration
job:
  name: "hello_world_app"
  description: "Hello World application build"
  output_dir: "examples/output"

# Scheduler configuration
scheduler:
  type: "slurm"
  queue: "compute"
  nodes: 1
  tasks_per_node: 1
  time_limit: "00:10:00"

# Template configuration
template:
  base_template: "application_build.j2"

# Environment configuration
environment:
  modules:
    - "gcc/11.2.0"

# Application configuration
application:
  name: "hello_world"
  source_dir: "examples/input/hello_world"
  build_script: "gcc -o hello_world hello_world.c"
  output_binary: "hello_world" 